name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: .go-version, check-latest: true }
      # Same gates as `make ci` locally; the race detector needs cgo, which
      # GitHub runners have. go.mod keeps the language floor; .go-version
      # picks the toolchain major (latest patch) and moves together with the
      # staticcheck pin in the Makefile.
      - run: make ci TESTFLAGS=-race
