name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: .go-version, check-latest: true }
      # Same gates as `make ci` locally; the race detector needs cgo, which
      # GitHub runners have. go.mod keeps the language floor; .go-version
      # picks the toolchain major (latest patch) and moves together with the
      # staticcheck pin in the Makefile.
      - run: make ci TESTFLAGS=-race
